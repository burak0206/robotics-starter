syntax = "proto3";

package robotics.v1;

option java_multiple_files = true;
option java_package = "dev.robotics.proto";

service RobotService {
  rpc GetStatus(GetStatusRequest) returns (RobotStatus);
  rpc Stop(StopRequest) returns (StopResponse);
}

message GetStatusRequest {}
message StopRequest {}

message RobotStatus {
  string robot_id = 1;
  string name = 2;
  string mode = 3;
  string state = 4;
  optional uint32 battery_percent = 5;
  optional double linear_velocity_mps = 6;
  int64 observed_at_unix_ms = 7;
}

message StopResponse {
  bool accepted = 1;
  string message = 2;
  RobotStatus status = 3;
}

// One simulated elevator. Commands never move a physical robot or elevator.
service ElevatorService {
  rpc GetStatus(GetElevatorStatusRequest) returns (ElevatorStatus);
  rpc Call(CallElevatorRequest) returns (ElevatorStatus);
  rpc SelectFloor(SelectFloorRequest) returns (ElevatorStatus);
  rpc AdvanceSimulation(AdvanceElevatorSimulationRequest) returns (ElevatorStatus);
}

message GetElevatorStatusRequest {}
message CallElevatorRequest { int32 pickup_floor = 1; }
message SelectFloorRequest { int32 destination_floor = 1; }
message AdvanceElevatorSimulationRequest { string expected_state = 1; }

message ElevatorStatus {
  string elevator_id = 1;
  string mode = 2;
  string state = 3;
  int32 current_floor = 4;
  optional int32 pickup_floor = 5;
  optional int32 destination_floor = 6;
  bool doors_open = 7;
  bool robot_in_cabin = 8;
  int64 observed_at_unix_ms = 9;
}

// One simulated door. Commands never operate a physical door or robot.
service DoorService {
  rpc GetStatus(GetDoorStatusRequest) returns (DoorStatus);
  rpc RequestPassage(RequestDoorPassageRequest) returns (DoorStatus);
  rpc StartPassage(StartDoorPassageRequest) returns (DoorStatus);
  rpc AdvanceSimulation(AdvanceDoorSimulationRequest) returns (DoorStatus);
}

message GetDoorStatusRequest {}
message RequestDoorPassageRequest {}
message StartDoorPassageRequest {}
message AdvanceDoorSimulationRequest { string expected_state = 1; }

message DoorStatus {
  string door_id = 1;
  string mode = 2;
  string state = 3;
  bool door_open = 4;
  bool passage_allowed = 5;
  bool robot_in_doorway = 6;
  int64 observed_at_unix_ms = 7;
}
